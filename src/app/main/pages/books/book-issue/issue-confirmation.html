<div class="confirmation-page">
  <div class="confirmation-card">
    <div class="success-icon">
      <i class="pi pi-check-circle"></i>
    </div>
    <h2>Book Issued Successfully</h2>
    <p class="subtitle">The book has been allocated to the learner</p>

    <div class="details">
      <div class="detail-row"><span class="label">Learner:</span><span>{{ learnerName }}</span></div>
      <div class="detail-row"><span class="label">Book QR:</span><span>{{ bookQr }}</span></div>
      <div class="detail-row"><span class="label">Condition:</span><span>{{ condition }}</span></div>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" (click)="goToBooks()">
        <i class="pi pi-book"></i> View Books
      </button>
      <button class="btn btn-primary" (click)="issueAnother()">
        <i class="pi pi-plus"></i> Issue Another
      </button>
    </div>
  </div>
</div>
