<div class="form-page">
  <div class="form-header">
    <button class="back-btn" (click)="cancel()">
      <i class="pi pi-arrow-left"></i>
    </button>
    <h2 class="form-title">{{ isEdit ? 'Edit Teacher' : 'Add New Teacher' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
    <div class="form-grid">
      <div class="form-field">
        <label>First Name *</label>
        <input formControlName="firstName" placeholder="Enter first name" />
      </div>
      <div class="form-field">
        <label>Last Name *</label>
        <input formControlName="lastName" placeholder="Enter last name" />
      </div>
      <div class="form-field">
        <label>Email *</label>
        <input formControlName="email" type="email" placeholder="teacher@school.edu" />
      </div>
      <div class="form-field">
        <label>Phone *</label>
        <input formControlName="phone" placeholder="e.g. 082-555-1001" />
      </div>
      <div class="form-field">
        <label>Staff Number *</label>
        <input formControlName="staffNumber" placeholder="e.g. STF001" />
      </div>
      <div class="form-field">
        <label>School *</label>
        <select formControlName="schoolId">
          <option value="">Select a school</option>
          <option *ngFor="let school of schools" [value]="school.id">{{ school.name }}</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="!form.valid || isLoading">
        <i class="pi pi-check" *ngIf="!isLoading"></i>
        <i class="pi pi-spin pi-spinner" *ngIf="isLoading"></i>
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>
