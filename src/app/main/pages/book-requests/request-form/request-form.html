<div class="form-page">
  <div class="form-header">
    <button class="back-btn" (click)="cancel()">
      <i class="pi pi-arrow-left"></i>
    </button>
    <h2 class="form-title">{{ isEdit ? 'Edit Request' : 'New Book Request' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
    <div class="form-grid">
      <div class="form-field">
        <label>School *</label>
        <select formControlName="schoolId">
          <option value="">Select a school</option>
          <option *ngFor="let school of schools" [value]="school.id">{{ school.name }}</option>
        </select>
      </div>
      <div class="form-field">
        <label>Subject *</label>
        <select formControlName="subjectId">
          <option value="">Select a subject</option>
          <option *ngFor="let subject of subjects" [value]="subject">{{ subject }}</option>
        </select>
      </div>
      <div class="form-field">
        <label>Grade *</label>
        <select formControlName="gradeId">
          <option value="">Select a grade</option>
          <option *ngFor="let grade of grades" [value]="grade">{{ grade }}</option>
        </select>
      </div>
      <div class="form-field">
        <label>Quantity *</label>
        <input formControlName="quantity" type="number" placeholder="Number of books needed" />
      </div>
      <div class="form-field full">
        <label>Reason *</label>
        <textarea formControlName="reason" placeholder="Explain why these books are needed..." rows="4"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="!form.valid || isLoading">
        <i class="pi pi-check" *ngIf="!isLoading"></i>
        <i class="pi pi-spin pi-spinner" *ngIf="isLoading"></i>
        {{ isEdit ? 'Update' : 'Submit Request' }}
      </button>
    </div>
  </form>
</div>
