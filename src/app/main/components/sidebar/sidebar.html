<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- Logo section -->
  <div class="sidebar-header">
    <div class="logo-section" *ngIf="!collapsed">
      <div class="logo-icon">
        <i class="pi pi-book"></i>
      </div>
      <div class="logo-text">
        <span class="logo-title">SBMS</span>
        <span class="logo-subtitle">Book Management</span>
      </div>
    </div>
    <div class="logo-section" *ngIf="collapsed">
      <div class="logo-icon small">
        <i class="pi pi-book"></i>
      </div>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()" [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <i class="pi" [class.pi-angle-left]="!collapsed" [class.pi-angle-right]="collapsed"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item" [class.active]="isActive(item.route)">
        <a [routerLink]="item.route" class="nav-link" [title]="item.label">
          <i [class]="item.icon" class="nav-icon"></i>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer / User section -->
  <div class="sidebar-footer">
    <div class="user-section" *ngIf="!collapsed">
      <div class="user-avatar">
        <i class="pi pi-user"></i>
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser }}</span>
        <span class="user-role">{{ currentUserRole }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" [title]="'Logout'">
      <i class="pi pi-sign-out"></i>
      <span *ngIf="!collapsed">Logout</span>
    </button>
  </div>
</aside>
